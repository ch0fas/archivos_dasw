<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: bisque;
        }
        h1
        {
            text-align: center;
        }
        table
        {
            border: 1px solid;
            width: 90%;
            margin: auto;
        }
        td
        {
            border: 1px solid;
            text-align: center;
        }
        tr:nth-child(even)
        {
            background-color: #ffc857; 
        }
        tr:nth-child(odd)
        {
            background-color: #b5dfca;
        }
        tr:first-child
        {
            background-color: black;
            color: white;
            font-style: italic;
        }
        td:hover
        {
            background-color: red;
            color: white;
        }
        input[type="text"]
        {
            border-radius: 10px;
        }
        input:invalid
        {
            background-color: red;
            color: white;
        }
        #to_tc_button
        {
            background-color: beige;
            border: 0px;
        }
        #to_babel
        {
            color: black;
        }
        input[type="checkbox"]
        {
            cursor: pointer;
        }
        input:checked
        {
            box-shadow: 0 0 0 2px green;
            background-color: aquamarine;
        }
        input[type="submit"]
        {
            background-color: beige;
            border: 0px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tabla Multicolor</h1>
    <table>
        <tr>
            <td>(1,1)</td>
            <td>(2,1)</td>
            <td>(3,1)</td>
            <td>(4,1)</td>
            <td>(5,1)</td>
        </tr>
        <tr>
            <td>(1,2)</td>
            <td>(2,2)</td>
            <td>(3,2)</td>
            <td>(4,2)</td>
            <td>(5,2)</td>
        </tr>
        <tr>
            <td>(1,3)</td>
            <td>(2,3)</td>
            <td>(3,3)</td>
            <td>(4,3)</td>
            <td>(5,3)</td>
        </tr>
        <tr>
            <td>(1,4)</td>
            <td>(2,4)</td>
            <td>(3,4)</td>
            <td>(4,4)</td>
            <td>(5,4)</td>
        </tr>
        <tr>
            <td>(1,5)</td>
            <td>(2,5)</td>
            <td>(3,5)</td>
            <td>(4,5)</td>
            <td>(5,5)</td>
        </tr>
    </table>
    <h1>Formulario</h1>
    <form action="javascript:alert('Form enviado con exito!')">
        Nombre: <input type="text"><br>
        Carrera: <input type="text"><br>
        Correo: <input type="email"><br>
        <button id="to_tc_button"><a href="https://libraryofbabel.info/" target="_blank" id="to_babel">Da click para revisar términos y condiciones (leelo todo!)</a></button><br>
        Aceptas TyC? <input type="checkbox"><br>
        Si lo leíste todo? <input type="checkbox"><br>
        De verdad? <input type="checkbox"><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
